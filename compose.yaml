name: amadban
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amadban
      POSTGRES_USER: amadban
      POSTGRES_PASSWORD: ${AMADBAN_DB_PASSWORD:?Set AMADBAN_DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amadban -d amadban"]
      interval: 3s
      timeout: 3s
      retries: 15
  web:
    image: amadban-web:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AMADBAN_DB_HOST: db
      AMADBAN_DB_PASSWORD: ${AMADBAN_DB_PASSWORD:?Set AMADBAN_DB_PASSWORD}
      AMADBAN_ADMIN_PASSWORD: ${AMADBAN_ADMIN_PASSWORD:?Set AMADBAN_ADMIN_PASSWORD}
      AMADBAN_KEYS: /keys
    ports:
      - "${AMADBAN_BIND_ADDRESS:-127.0.0.1}:${AMADBAN_PORT:-8088}:8080"
    volumes:
      - keys:/keys
volumes:
  data:
  keys:
